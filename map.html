<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rental Candidate Map</title>
    <link rel="stylesheet" href="map.css">
  </head>
  <body>
    <main class="map-app">
      <header class="map-header">
        <div>
          <h1>Candidate Map</h1>
          <p id="mapStatus">Loading candidates...</p>
        </div>
        <div class="map-actions">
          <button id="fitBtn" type="button">Fit</button>
          <button id="zoomOutBtn" type="button">-</button>
          <button id="zoomInBtn" type="button">+</button>
        </div>
      </header>

      <section class="map-layout">
        <div id="map" class="map" aria-label="Candidate locations">
          <a class="attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap, CARTO</a>
        </div>
        <aside class="candidate-panel">
          <ol id="candidateList" class="numbered-list"></ol>
        </aside>
      </section>
    </main>
    <script src="map.js"></script>
  </body>
</html>
